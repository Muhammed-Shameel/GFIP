services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gfip
      POSTGRES_USER: gfip
      POSTGRES_PASSWORD: gfip
    ports:
      - "5432:5432"
    volumes:
      - gfip_postgres:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://gfip:gfip@db:5432/gfip
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  gfip_postgres:
